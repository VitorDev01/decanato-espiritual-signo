<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Influência Astral</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg1: #020b0a;
    --bg2: #001a12;
    --card: rgba(0, 255, 80, 0.06);
    --stroke: rgba(0, 255, 100, 0.18);
    --text: #e0ffe6;
    --muted: #00cc77;
    --accent: #00ff88;
    --accent2: #00ff44;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Share Tech Mono', monospace;
}
body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #003322, var(--bg1));
    color: var(--text);
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.container {
    width: 100%;
    max-width: 460px;
    padding: 25px;
    border-radius: 18px;
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--stroke);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 255, 100, 0.15);
    margin-top: 60px;
}
h1 {
    text-align: center;
    font-size: 19px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 15px var(--accent);
}
label {
    display: block;
    margin: 15px 0 6px;
    color: var(--muted);
}
input[type="date"], input[type="file"] {
    width: 100%;
    padding: 16px 18px;
    border-radius: 12px;
    border: 1px solid var(--stroke);
    background: rgba(0, 20, 10, 0.6);
    color: #00ffaa;
    font-size: 16px;
}
.btn-matrix {
    width: 100%;
    padding: 16px;
    margin: 15px 0;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: black;
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 255, 100, 0.5);
}
.btn-matrix:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 25px var(--accent);
}
.profile-container {
    text-align: center;
    margin: 20px 0 10px 0;
}
.profile-img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    box-shadow: 0 0 30px rgba(0, 255, 100, 0.6);
    object-fit: cover;
}
.result {
    margin-top: 20px;
    padding: 18px;
    border-radius: 14px;
    background: rgba(0, 30, 20, 0.6);
    border: 1px solid var(--stroke);
    display: none;
}
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
}
.card {
    background: rgba(0, 40, 25, 0.6);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--stroke);
    text-align: center;
}
.card span {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
}
.card strong {
    color: var(--accent);
    font-size: 16px;
}
</style>
</head>
<body>
<div class="container">
    <h1> Decanato + Ciclos de 7</h1>
   
    <label>Data de nascimento</label>
    <input type="date" id="dataNascimento">
    
    <label>Foto de Perfil</label>
    <input type="file" id="profileUpload" accept="image/*">
    
    <div class="profile-container" id="profileContainer" style="display: none;">
        <img id="profileImg" class="profile-img" alt="Foto de Perfil">
    </div>
    
    <button class="btn-matrix" onclick="calcular()">Revelar Influência</button>
    
    <div class="result" id="resultado">
        <div class="big" id="signo" style="font-size:22px; text-align:center; margin:15px 0;"></div>
        <div class="grid">
            <div class="card"><span>Decanato</span><strong id="decanato"></strong></div>
            <div class="card"><span>Planeta</span><strong id="planeta"></strong></div>
            <div class="card"><span>Arquétipo</span><strong id="arquetipo"></strong></div>
            <div class="card"><span>Idade</span><strong id="idade"></strong></div>
            <div class="card"><span>Ciclo de Lilith</span><strong id="cicloLilith"></strong></div>
            <div class="card"><span>Arcano do Tarot</span><strong id="arcanoTarot"></strong></div>
        </div>
    </div>
</div>

<script>
// Dados Astrológicos
const icones = {
  "Áries":"♈︎ Marte", "Touro":"♉︎ Venus", "Gêmeos":"♊︎ Hermes", "Câncer":"♋︎ Lilith",
  "Leão":"♌︎ Apolo", "Virgem":"♍︎ Venus", "Libra":"♎︎ Venus", "Escorpião":"♏︎ Plutão",
  "Sagitário":"♐︎ Zeus", "Capricórnio":"♑︎ Saturno", "Aquário":"♒︎ Urano", "Peixes":"♓︎ Leviatã"
};

const signos = [
    { nome:"Capricórnio", inicio:[12,22], fim:[1,19] },
    { nome:"Aquário", inicio:[1,20], fim:[2,18] },
    { nome:"Peixes", inicio:[2,19], fim:[3,20] },
    { nome:"Áries", inicio:[3,21], fim:[4,19] },
    { nome:"Touro", inicio:[4,20], fim:[5,20] },
    { nome:"Gêmeos", inicio:[5,21], fim:[6,20] },
    { nome:"Câncer", inicio:[6,21], fim:[7,22] },
    { nome:"Leão", inicio:[7,23], fim:[8,22] },
    { nome:"Virgem", inicio:[8,23], fim:[9,22] },
    { nome:"Libra", inicio:[9,23], fim:[10,22] },
    { nome:"Escorpião", inicio:[10,23], fim:[11,21] },
    { nome:"Sagitário", inicio:[11,22], fim:[12,21] }
];

const decanatos = {
    "Áries": [{planeta:"Marte", arquetipo:"Ares"}, {planeta:"Sol", arquetipo:"Hélio"}, {planeta:"Vênus", arquetipo:"Afrodite"}],
    "Touro": [{planeta:"Vênus", arquetipo:"Afrodite"}, {planeta:"Mercúrio", arquetipo:"Hermes"}, {planeta:"Saturno", arquetipo:"Cronos"}],
    "Gêmeos": [{planeta:"Mercúrio", arquetipo:"Hermes"}, {planeta:"Vênus", arquetipo:"Afrodite"}, {planeta:"Urano", arquetipo:"Ouranos"}],
    "Câncer": [{planeta:"Lua", arquetipo:"Selene"}, {planeta:"Plutão", arquetipo:"Hades"}, {planeta:"Netuno", arquetipo:"Poseidon"}],
    "Leão": [{planeta:"Sol", arquetipo:"Hélio"}, {planeta:"Júpiter", arquetipo:"Zeus"}, {planeta:"Marte", arquetipo:"Ares"}],
    "Virgem": [{planeta:"Mercúrio", arquetipo:"Hermes"}, {planeta:"Saturno", arquetipo:"Cronos"}, {planeta:"Vênus", arquetipo:"Afrodite"}],
    "Libra": [{planeta:"Vênus", arquetipo:"Afrodite"}, {planeta:"Saturno", arquetipo:"Cronos"}, {planeta:"Júpiter", arquetipo:"Zeus"}],
    "Escorpião": [{planeta:"Plutão", arquetipo:"Hades"}, {planeta:"Marte", arquetipo:"Ares"}, {planeta:"Lua", arquetipo:"Selene"}],
    "Sagitário": [{planeta:"Júpiter", arquetipo:"Zeus"}, {planeta:"Marte", arquetipo:"Ares"}, {planeta:"Sol", arquetipo:"Hélio"}],
    "Capricórnio": [{planeta:"Saturno", arquetipo:"Cronos"}, {planeta:"Vênus", arquetipo:"Afrodite"}, {planeta:"Mercúrio", arquetipo:"Hermes"}],
    "Aquário": [{planeta:"Urano", arquetipo:"Ouranos"}, {planeta:"Mercúrio", arquetipo:"Hermes"}, {planeta:"Vênus", arquetipo:"Afrodite"}],
    "Peixes": [{planeta:"Netuno", arquetipo:"Poseidon"}, {planeta:"Lua", arquetipo:"Selene"}, {planeta:"Plutão", arquetipo:"Hades"}]
};

// Arcanos Maiores do Tarot (corrigido)
const arcanos = {
    0: "0 - O Louco", 1: "1 - O Mago", 2: "2 - A Sacerdotisa", 3: "3 - A Imperatriz",
    4: "4 - O Imperador", 5: "5 - O Hierofante", 6: "6 - Os Enamorados", 7: "7 - O Carro",
    8: "8 - A Força", 9: "9 - O Eremita", 10: "10 - A Roda da Fortuna", 11: "11 - A Justiça",
    12: "12 - O Enforcado", 13: "13 - A Morte", 14: "14 - A Temperança", 15: "15 - O Diabo",
    16: "16 - A Torre", 17: "17 - A Estrela", 18: "18 - A Lua", 19: "19 - O Sol",
    20: "20 - O Julgamento", 21: "21 - O Mundo", 22: "22 - O Mundo"
};

// Funções
function parseDate(input){
    const [y,m,d] = input.split("-").map(Number);
    return new Date(y, m-1, d);
}

function idade(d){
    const h = new Date();
    let i = h.getFullYear() - d.getFullYear();
    if (h.getMonth() < d.getMonth() || (h.getMonth() === d.getMonth() && h.getDate() < d.getDate())) i--;
    return i;
}

function getSigno(date){
    const m = date.getMonth()+1;
    const d = date.getDate();
    for(let s of signos){
        const [sm, sd] = s.inicio;
        const [em, ed] = s.fim;
        if (sm < em || (sm === em && sd <= ed)){
            if ((m === sm && d >= sd) || (m === em && d <= ed) || (m > sm && m < em)){
                return s.nome;
            }
        } else {
            if ((m === sm && d >= sd) || (m === em && d <= ed) || m > sm || m < em){
                return s.nome;
            }
        }
    }
    return "Áries";
}

function getDecanato(signo, date){
    const lista = decanatos[signo];
    const start = signos.find(s => s.nome === signo).inicio;
    const startM = start[0];
    const startD = start[1];
    const m = date.getMonth()+1;
    const d = date.getDate();
    let diff = ((m*30 + d) - (startM*30 + startD));
    if(diff < 0) diff += 30;
    let dec = Math.floor(diff / 10);
    if(dec > 2) dec = 2;
    return {
        decanato: (dec+1)+"º Decanato",
        planeta: lista[dec].planeta,
        arquetipo: lista[dec].arquetipo
    };
}

function getCicloLilith(anos){
    if(anos < 0) return "Ainda não nasceu";
    const ciclo = Math.min(Math.floor(anos / 7) + 1, 7);
    return `${ciclo}º Ciclo de Lilith`;
}

function calcularArcano(dataStr) {
    const numeros = dataStr.replace(/-/g, '');
    let soma = 0;
    for(let char of numeros) soma += parseInt(char);
    
    while (soma > 22) {
        let temp = 0;
        let num = soma;
        while (num > 0) {
            temp += num % 10;
            num = Math.floor(num / 10);
        }
        soma = temp;
    }
    if (soma === 0) soma = 22;
    return arcanos[soma];
}

// Preview da foto
document.getElementById("profileUpload").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const img = document.getElementById("profileImg");
    const container = document.getElementById("profileContainer");
    img.src = URL.createObjectURL(file);
    container.style.display = "block";
});

// Função Principal
function calcular(){
    const input = document.getElementById("dataNascimento").value;
    if(!input) {
        alert("Por favor, insira sua data de nascimento");
        return;
    }
   
    const d = parseDate(input);
    const signo = getSigno(d);
    const dec = getDecanato(signo, d);
    const anos = idade(d);
    const arcano = calcularArcano(input);

    document.getElementById("signo").innerText = icones[signo] + " " + signo;
    document.getElementById("decanato").innerText = dec.decanato;
    document.getElementById("planeta").innerText = dec.planeta;
    document.getElementById("arquetipo").innerText = dec.arquetipo;
    document.getElementById("idade").innerText = anos + " anos";
    document.getElementById("cicloLilith").innerText = getCicloLilith(anos);
    document.getElementById("arcanoTarot").innerText = arcano;
   
    document.getElementById("resultado").style.display = "block";
}
</script>
</body>
</html>
